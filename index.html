<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Coaching - Live Mock Test Portal</title>
    
    <!-- Firebase SDK (Version 10.8.0 - Module Imports) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // ⚠️ আপনার Firebase Console -> Project Settings থেকে পাওয়া Config এখানে বসাবেন
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Firebase ইনিশিয়ালাইজেশন
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // ১. সিঙ্গেল প্রশ্ন ক্লাউডে সেভ করার ফাংশন
        window.saveQuestionToCloud = function(categoryKey, newQuestion) {
            const qListRef = ref(db, 'questions/' + categoryKey);
            const newQRef = push(qListRef);
            return set(newQRef, newQuestion);
        };

        // ২. বাল্ক ক্যাটাগরি ওভাররাইট/সেভ ফাংশন
        window.saveBulkToCloud = function(categoryKey, questionsArray) {
            const qListRef = ref(db, 'questions/' + categoryKey);
            return set(qListRef, questionsArray);
        };

        // ৩. রিয়েল-টাইম ডাটা সিঙ্ক (সব স্টুডেন্টদের জন্য একসাথে ইন্সট্যান্ট আপডেট)
        const questionsRef = ref(db, 'questions');
        onValue(questionsRef, (snapshot) => {
            const data = snapshot.val();
            window.questionsDatabase = {};

            if (data) {
                // Firebase Object structure-কে Array-তে রূপান্তর
                Object.keys(data).forEach(cat => {
                    if (Array.isArray(data[cat])) {
                        window.questionsDatabase[cat] = data[cat];
                    } else if (typeof data[cat] === 'object') {
                        window.questionsDatabase[cat] = Object.values(data[cat]);
                    }
                });
            }
            
            // হোম পেজের কার্ড কাউন্ট ও ভিউ আপডেট
            if (typeof updateCardCounts === 'function') {
                updateCardCounts();
            }
        });
    </script>

    <style>
        /* বেসিক রেসপন্সিভ লেআউট স্টাইল */
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f3f4f6; color: #1f2937; padding: 20px; }
        .page-title { font-size: 24px; font-weight: bold; margin-bottom: 20px; color: #1e293b; }
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .test-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); display: flex; flex-direction: column; justify-content: space-between; height: 180px; }
        .card-tag { font-size: 12px; font-weight: bold; color: #64748b; margin-bottom: 8px; display: flex; justify-content: space-between; }
        .card-title { font-size: 18px; font-weight: bold; color: #0f172a; }
        .btn-card { background: #2563eb; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 15px; width: 100%; }
        .btn-card:hover { opacity: 0.9; }
        
        /* মোডাল ও টেস্ট ইন্টারফেস স্টাইল */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; width: 90%; max-width: 900px; height: 85vh; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; }
        .modal-header { background: #1e293b; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .quiz-container { display: flex; flex: 1; overflow: hidden; }
        .question-section { flex: 3; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; justify-content: space-between; }
        .palette-section { flex: 1; background: #f8fafc; padding: 15px; border-left: 1px solid #e2e8f0; overflow-y: auto; }
        .option-item { background: #f1f5f9; padding: 12px; border-radius: 8px; margin: 8px 0; cursor: pointer; list-style: none; border: 2px solid transparent; }
        .option-item.selected { border-color: #2563eb; background: #eff6ff; font-weight: bold; }
        
        /* কোশ্চেন প্যালেট বাটনের রঙ */
        .palette-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
        .q-btn { padding: 10px; border: 1px solid #cbd5e1; background: white; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .q-btn.answered { background: #10b981; color: white; border-color: #10b981; }
        .q-btn.skipped { background: #ef4444; color: white; border-color: #ef4444; }
        .q-btn.marked { background: #8b5cf6; color: white; border-color: #8b5cf6; }
        .q-btn.active { border: 2px solid #000; }

        /* রেজাল্ট সেকশন */
        .result-box { padding: 20px; overflow-y: auto; height: 100%; }
        .stat-badge { display: inline-block; padding: 8px 15px; border-radius: 6px; margin: 5px; font-weight: bold; }
        .solution-card { background: #f8fafc; padding: 15px; border-radius: 8px; margin-bottom: 12px; border-left: 4px solid #3b82f6; }
        .ans-user-correct { color: #059669; font-weight: bold; }
        .ans-user-wrong { color: #dc2626; font-weight: bold; }
        .ans-correct-spec { color: #2563eb; font-weight: bold; }
    </style>
</head>
<body>

    <!-- হেডার/নেভিগেশন -->
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h2>🎯 Smart Mock Test Portal</h2>
        <button class="btn-card" style="width:auto; background:#475569;" onclick="triggerAdminLogin()">🔐 Admin Panel</button>
    </div>

    <!-- মেইন কন্টেন্ট এরিয়া -->
    <div id="mainContent"></div>

    <!-- টেস্ট দেওয়ার মোডাল -->
    <div id="quizModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div id="modalTitle" style="font-weight:bold; font-size:18px;">Mock Test</div>
                <button onclick="closeModal('quizModal')" style="background:none; border:none; color:white; font-size:20px; cursor:pointer;">✖</button>
            </div>
            
            <!-- পরীক্ষা চালুর স্ক্রিন -->
            <div id="quizBody" class="quiz-container">
                <div class="question-section">
                    <div>
                        <div id="qCount" style="color:#64748b; font-size:14px; margin-bottom:10px;"></div>
                        <h3 id="qText" style="margin-bottom:15px;"></h3>
                        <ul id="optList"></ul>
                    </div>
                    <div style="display:flex; gap:10px; margin-top:20px;">
                        <button id="prevBtn" class="btn-card" style="background:#64748b;" onclick="prevQuestion()">Previous</button>
                        <button class="btn-card" style="background:#f59e0b;" onclick="skipQuestion()">Skip</button>
                        <button class="btn-card" style="background:#8b5cf6;" onclick="markForReview()">Mark for Review</button>
                        <button class="btn-card" style="background:#10b981;" onclick="nextQuestion()">Save & Next</button>
                    </div>
                </div>
                <div class="palette-section">
                    <h4>Question Palette</h4>
                    <div id="paletteGrid" class="palette-grid"></div>
                    <button class="btn-card" style="background:#ef4444; margin-top:30px;" onclick="finishQuiz()">Submit Exam</button>
                </div>
            </div>

            <!-- রেজাল্ট ও সলিউশন স্ক্রিন -->
            <div id="resultBody" class="result-box" style="display:none;">
                <h2>📊 Exam Result Summary</h2>
                <h3 id="totalScoreText" style="margin: 10px 0; color:#2563eb;"></h3>
                <div>
                    <span class="stat-badge" style="background:#d1fae5; color:#065f46;">সঠিক: <b id="statCorrect">0</b></span>
                    <span class="stat-badge" style="background:#fee2e2; color:#991b1b;">ভুল: <b id="statWrong">0</b></span>
                    <span class="stat-badge" style="background:#f3f4f6; color:#1f2937;">স্কিপড: <b id="statSkipped">0</b></span>
                </div>
                <hr style="margin:20px 0;">
                <h3>📝 Answer Key & Solutions</h3>
                <div id="solutionsContainer" style="margin-top:15px;"></div>
            </div>
        </div>
    </div>

    <!-- অ্যাডমিন প্যানেল মোডাল -->
    <div id="adminModal" class="modal">
        <div class="modal-content" style="height:auto; max-height:90vh; padding:20px; overflow-y:auto;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <h3>Admin Question Control Panel</h3>
                <button onclick="closeModal('adminModal')" style="border:none; background:none; font-size:20px; cursor:pointer;">✖</button>
            </div>
            
            <div style="display:flex; gap:10px; margin-bottom:15px;">
                <button id="singleTabBtn" class="btn-card" style="margin:0;" onclick="switchTab('single')">Single Question Add</button>
                <button id="bulkTabBtn" class="btn-card" style="margin:0; background:#64748b;" onclick="switchTab('bulk')">Bulk Import (JSON)</button>
            </div>

            <!-- সিঙ্গেল কোশ্চেন ফর্ম -->
            <form id="singleForm" onsubmit="addNewQuestion(event)">
                <label>Select Subject/Category:</label>
                <select id="addTypeKey" style="width:100%; padding:8px; margin:8px 0;">
                    <option value="gk">General Knowledge (GK)</option>
                    <option value="math">Mathematics</option>
                    <option value="gi">Reasoning (GI)</option>
                    <option value="live">Live Test</option>
                </select>

                <input type="text" id="addQuestionText" placeholder="প্রশ্ন টাইপ করুন" required style="width:100%; padding:8px; margin:5px 0;">
                <input type="text" id="opt0" placeholder="Option A" required style="width:100%; padding:8px; margin:5px 0;">
                <input type="text" id="opt1" placeholder="Option B" required style="width:100%; padding:8px; margin:5px 0;">
                <input type="text" id="opt2" placeholder="Option C" required style="width:100%; padding:8px; margin:5px 0;">
                <input type="text" id="opt3" placeholder="Option D" required style="width:100%; padding:8px; margin:5px 0;">
                
                <label>Correct Answer Index:</label>
                <select id="addCorrect" style="width:100%; padding:8px; margin:8px 0;">
                    <option value="0">Option A</option>
                    <option value="1">Option B</option>
                    <option value="2">Option C</option>
                    <option value="3">Option D</option>
                </select>

                <button type="submit" class="btn-card" style="background:#10b981;">Save to Firebase Live</button>
            </form>

            <!-- বাল্ক কাস্টম JSON ফর্ম -->
            <form id="bulkForm" onsubmit="addBulkQuestions(event)" style="display:none;">
                <label>Select Category:</label>
                <select id="bulkTypeKey" style="width:100%; padding:8px; margin:8px 0;">
                    <option value="gk">General Knowledge (GK)</option>
                    <option value="math">Mathematics</option>
                    <option value="gi">Reasoning (GI)</option>
                    <option value="live">Live Test</option>
                </select>
                <textarea id="bulkJsonInput" placeholder='Paste JSON Array here...' rows="8" style="width:100%; padding:8px; margin:8px 0;"></textarea>
                <button type="submit" class="btn-card" style="background:#8b5cf6;">Upload All Questions to Firebase</button>
            </form>
        </div>
    </div>

    <!-- মেইন পোর্টাল ও কুইজ লজিক -->
    <script>
        // গ্লোবাল স্টেট
        window.questionsDatabase = { gk: [], math: [], gi: [], live: [] };

        function showDashboardHome() {
            const container = document.getElementById('mainContent');
            container.innerHTML = `
                <div class="page-title">Mock Test Series Portal</div>
                <div class="cards-grid">
                    <div class="test-card">
                        <div>
                            <div class="card-tag"><span>SPECIAL LIVE TEST</span> <span id="liveCountTag">0 Questions</span></div>
                            <div class="card-title">🔴 All India Live Mock Test (1 Hr 30 Min)</div>
                        </div>
                        <button class="btn-card" style="background:#ef4444;" onclick="startMockTest('live')">Start Live Test</button>
                    </div>
                    <div class="test-card">
                        <div>
                            <div class="card-tag"><span>GENERAL KNOWLEDGE</span> <span id="gkCountTag">0 Questions</span></div>
                            <div class="card-title">General Knowledge & Current Affairs Test</div>
                        </div>
                        <button class="btn-card" onclick="startMockTest('gk')">Start GK Test (20 Min)</button>
                    </div>
                    <div class="test-card">
                        <div>
                            <div class="card-tag"><span>MATHEMATICS</span> <span id="mathCountTag">0 Questions</span></div>
                            <div class="card-title">Math & Numerical Ability Practice Test</div>
                        </div>
                        <button class="btn-card" style="background:#0e9f6e;" onclick="startMockTest('math')">Start Math Test (20 Min)</button>
                    </div>
                    <div class="test-card">
                        <div>
                            <div class="card-tag"><span>REASONING</span> <span id="giCountTag">0 Questions</span></div>
                            <div class="card-title">General Intelligence & Logical Reasoning</div>
                        </div>
                        <button class="btn-card" style="background:#8b5cf6;" onclick="startMockTest('gi')">Start Reasoning Test (20 Min)</button>
                    </div>
                </div>
            `;
            updateCardCounts();
        }

        function updateCardCounts() {
            if(document.getElementById('gkCountTag')) document.getElementById('gkCountTag').innerText = (window.questionsDatabase.gk ? window.questionsDatabase.gk.length : 0) + " Questions";
            if(document.getElementById('mathCountTag')) document.getElementById('mathCountTag').innerText = (window.questionsDatabase.math ? window.questionsDatabase.math.length : 0) + " Questions";
            if(document.getElementById('giCountTag')) document.getElementById('giCountTag').innerText = (window.questionsDatabase.gi ? window.questionsDatabase.gi.length : 0) + " Questions";
            if(document.getElementById('liveCountTag')) document.getElementById('liveCountTag').innerText = (window.questionsDatabase.live ? window.questionsDatabase.live.length : 0) + " Questions";
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
            if (id === 'quizModal') clearInterval(timerInterval);
        }

        function triggerAdminLogin() {
            let pwd = prompt("Admin Password লিখুন:");
            if (pwd === "smart123") {
                document.getElementById('adminModal').style.display = 'flex';
            } else if (pwd !== null) {
                alert("ভুল পাসওয়ার্ড!");
            }
        }

        function switchTab(tab) {
            if (tab === 'single') {
                document.getElementById('singleForm').style.display = 'block';
                document.getElementById('bulkForm').style.display = 'none';
            } else {
                document.getElementById('singleForm').style.display = 'none';
                document.getElementById('bulkForm').style.display = 'block';
            }
        }

        // Firebase-এ সিঙ্গেল প্রশ্ন সেভ
        async function addNewQuestion(e) {
            e.preventDefault();
            let key = document.getElementById('addTypeKey').value;
            let newQ = { 
                question: document.getElementById('addQuestionText').value, 
                options: [
                    document.getElementById('opt0').value,
                    document.getElementById('opt1').value,
                    document.getElementById('opt2').value,
                    document.getElementById('opt3').value
                ], 
                correct: parseInt(document.getElementById('addCorrect').value) 
            };

            if (typeof window.saveQuestionToCloud === 'function') {
                await window.saveQuestionToCloud(key, newQ);
                alert("প্রশ্নটি ক্লাউডে সেভ হয়েছে এবং সব স্টুডেন্টের জন্য লাইভ হয়ে গেছে!");
                closeModal('adminModal');
                e.target.reset();
            } else {
                alert("Firebase কানেকশন সঠিকভাবে কাজ করছে না!");
            }
        }

        // Firebase-এ বাল্ক প্রশ্ন সেভ
        async function addBulkQuestions(e) {
            e.preventDefault();
            let key = document.getElementById('bulkTypeKey').value;
            let rawJson = document.getElementById('bulkJsonInput').value;

            try {
                let parsedQuestions = JSON.parse(rawJson);
                if (Array.isArray(parsedQuestions)) {
                    await window.saveBulkToCloud(key, parsedQuestions);
                    alert(`${parsedQuestions.length} টি প্রশ্ন সফলভাবে লাইভ সেভ করা হয়েছে!`);
                    closeModal('adminModal');
                    e.target.reset();
                } else {
                    alert("JSON ডেটা সঠিকভাবে সাজানো নয়!");
                }
            } catch (err) {
                alert("ভুল JSON ফরম্যাট!");
            }
        }

        // কুইজ ইঞ্জিন ভ্যারিয়েবল
        let activeQuestions = [];
        let userAnswers = [];
        let questionStates = [];
        let currentQIndex = 0;
        let selectedOpt = null;
        let timerInterval = null;
        let timeLeft = 1200;

        function startMockTest(key) {
            activeQuestions = window.questionsDatabase[key] || [];
            if (activeQuestions.length === 0) {
                alert("এই ক্যাটাগরিতে এখনো কোনো প্রশ্ন আপলোড করা হয়নি!");
                return;
            }

            userAnswers = new Array(activeQuestions.length).fill(null);
            questionStates = new Array(activeQuestions.length).fill('unvisited');
            currentQIndex = 0;
            timeLeft = (key === 'live') ? 5400 : 1200; 

            document.getElementById('modalTitle').innerText = key.toUpperCase() + " - Live Test";
            document.getElementById('quizModal').style.display = 'flex';
            document.getElementById('quizBody').style.display = 'flex';
            document.getElementById('resultBody').style.display = 'none';
            
            showQuestion();
            startTimer();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                let minutes = Math.floor(timeLeft / 60);
                let seconds = timeLeft % 60;
                let formattedTime = `${minutes < 10 ? '0' : ''}${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;

                let timerDisplay = document.getElementById('modalTitle');
                let baseTitle = timerDisplay.innerText.split(' | ')[0];
                timerDisplay.innerText = `${baseTitle} | ⏱️ ${formattedTime}`;

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    alert("সময় শেষ! আপনার পরীক্ষা স্বয়ংক্রিয়ভাবে জমা হচ্ছে।");
                    finishQuiz();
                }
            }, 1000);
        }

        function showQuestion() {
            selectedOpt = userAnswers[currentQIndex];
            if (questionStates[currentQIndex] === 'unvisited') {
                questionStates[currentQIndex] = 'skipped';
            }

            let q = activeQuestions[currentQIndex];
            document.getElementById('qText').innerText = `${currentQIndex + 1}. ${q.question}`;
            document.getElementById('qCount').innerText = `প্রশ্ন ${currentQIndex + 1} / ${activeQuestions.length}`;

            let optHtml = '';
            q.options.forEach((opt, idx) => {
                let activeClass = selectedOpt === idx ? 'selected' : '';
                optHtml += `<li class="option-item ${activeClass}" onclick="selectOption(${idx})">${String.fromCharCode(65 + idx)}. ${opt}</li>`;
            });
            document.getElementById('optList').innerHTML = optHtml;

            renderPalette();
            document.getElementById('prevBtn').style.visibility = currentQIndex === 0 ? 'hidden' : 'visible';
        }

        function selectOption(idx) {
            selectedOpt = idx;
            userAnswers[currentQIndex] = idx;
            questionStates[currentQIndex] = 'answered';
            showQuestion();
        }

        function nextQuestion() {
            if (currentQIndex < activeQuestions.length - 1) {
                currentQIndex++;
                showQuestion();
            }
        }

        function prevQuestion() {
            if (currentQIndex > 0) {
                currentQIndex--;
                showQuestion();
            }
        }

        function skipQuestion() {
            if (userAnswers[currentQIndex] === null) {
                questionStates[currentQIndex] = 'skipped';
            }
            nextQuestion();
        }

        function markForReview() {
            questionStates[currentQIndex] = 'marked';
            nextQuestion();
        }

        function jumpToQuestion(idx) {
            currentQIndex = idx;
            showQuestion();
        }

        function renderPalette() {
            let paletteHtml = '';
            questionStates.forEach((state, i) => {
                let statusClass = state !== 'unvisited' ? state : '';
                let activeClass = currentQIndex === i ? 'active' : '';
                paletteHtml += `<button class="q-btn ${statusClass} ${activeClass}" onclick="jumpToQuestion(${i})">${i + 1}</button>`;
            });
            document.getElementById('paletteGrid').innerHTML = paletteHtml;
        }

        function finishQuiz() {
            clearInterval(timerInterval);
            let correct = 0, wrong = 0, skipped = 0;

            activeQuestions.forEach((q, i) => {
                if (userAnswers[i] === null) {
                    skipped++;
                } else if (userAnswers[i] === q.correct) {
                    correct++;
                } else {
                    wrong++;
                }
            });

            let score = (correct * 1) - (wrong * 0.25);

            document.getElementById('statCorrect').innerText = correct;
            document.getElementById('statWrong').innerText = wrong;
            document.getElementById('statSkipped').innerText = skipped;
            document.getElementById('totalScoreText').innerText = `প্রাপ্ত নম্বর: ${score.toFixed(2)} / ${activeQuestions.length}`;

            let solContainer = document.getElementById('solutionsContainer');
            solContainer.innerHTML = '';

            activeQuestions.forEach((q, i) => {
                let userAnsIndex = userAnswers[i];
                let isCorrect = userAnsIndex === q.correct;
                
                let userAnsText = userAnsIndex !== null ? `${String.fromCharCode(65 + userAnsIndex)}. ${q.options[userAnsIndex]}` : 'উত্তর দেওয়া হয়নি';
                let correctAnsText = `${String.fromCharCode(65 + q.correct)}. ${q.options[q.correct]}`;

                let statusBadge = isCorrect 
                    ? `<span class="ans-user-correct">আপনার উত্তর: ${userAnsText} (সঠিক)</span>`
                    : `<span class="ans-user-wrong">আপনার উত্তর: ${userAnsText}</span> <br><span class="ans-correct-spec">সঠিক উত্তর: ${correctAnsText}</span>`;

                solContainer.innerHTML += `
                    <div class="solution-card">
                        <div><b>${i + 1}. ${q.question}</b></div>
                        <div style="margin-top:5px;">${statusBadge}</div>
                    </div>
                `;
            });

            document.getElementById('quizBody').style.display = 'none';
            document.getElementById('resultBody').style.display = 'block';
        }

        window.onload = function() {
            showDashboardHome();
        };
    </script>
</body>
</html>
