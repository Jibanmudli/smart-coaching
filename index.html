<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Coaching - Online Mock Test</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 650px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #7f8c8d; margin-bottom: 25px; }
        .question { font-size: 18px; font-weight: 600; color: #34495e; margin-bottom: 15px; }
        .options { list-style: none; padding: 0; }
        .options li { background: #f8f9fa; border: 1px solid #ddd; margin-bottom: 10px; padding: 12px 15px; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .options li:hover { background: #eef2f5; }
        .options li.selected { background: #3498db; color: white; border-color: #3498db; }
        button { width: 100%; background: #2ecc71; color: white; border: none; padding: 12px; font-size: 16px; border-radius: 6px; cursor: pointer; margin-top: 15px; font-weight: bold; }
        button:hover { background: #27ae60; }
        #result-container { text-align: center; }
        .score-box { font-size: 24px; font-weight: bold; color: #2c3e50; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Smart Coaching</h1>
    <p class="subtitle">Online Mock Test Portal</p>
    <hr style="border:0; border-top:1px solid #eee; margin-bottom:20px;">

    <div id="quiz-container">
        <div class="question" id="question-text">প্রশ্ন লোড হচ্ছে...</div>
        <ul class="options" id="options-list"></ul>
        <button id="next-btn" onclick="nextQuestion()">পরবর্তী প্রশ্ন</button>
    </div>

    <div id="result-container" style="display: none;">
        <h2>মক টেস্ট সম্পন্ন হয়েছে!</h2>
        <div class="score-box" id="score-text"></div>
        <button onclick="location.reload()">পুনরায় টেস্ট দিন</button>
    </div>
</div>

<script>
    // আপনার প্রশ্নগুলো এখানে সাজিয়ে রাখুন
    const quizData = [
        {
            question: "১. ভারতের বৃহত্তম নদীর নাম কী?",
            options: ["গঙ্গা", "যমুনা", "গো দাবরী", "সিন্ধু"],
            correct: 0
        },
        {
            question: "২. ভারতের ব্ল্যাক সয়েল (Black Soil) প্রধানত কোন শিলা থেকে তৈরি হয়?",
            options: ["গ্রানাইট", "ব্যাসাল্ট", "বেলেপাথর", "মার্বেল"],
            correct: 1
        },
        {
            question: "৩. সিরিজের শূন্যস্থান পূরণ করুন: 2, 4, 8, 16, ?",
            options: ["20", "24", "32", "64"],
            correct: 2
        }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let selectedOption = null;

    function loadQuestion() {
        selectedOption = null;
        const currentQuiz = quizData[currentQuestionIndex];
        document.getElementById("question-text").innerText = currentQuiz.question;
        
        const optionsList = document.getElementById("options-list");
        optionsList.innerHTML = "";

        currentQuiz.options.forEach((option, index) => {
            const li = document.createElement("li");
            li.innerText = option;
            li.onclick = () => selectOption(li, index);
            optionsList.appendChild(li);
        });

        if (currentQuestionIndex === quizData.length - 1) {
            document.getElementById("next-btn").innerText = "সাবমিট করুন";
        }
    }

    function selectOption(element, index) {
        const allOptions = document.querySelectorAll(".options li");
        allOptions.forEach(opt => opt.classList.remove("selected"));
        element.classList.add("selected");
        selectedOption = index;
    }

    function nextQuestion() {
        if (selectedOption === null) {
            alert("অনুগ্রহ করে একটি উত্তর নির্বাচন করুন!");
            return;
        }

        if (selectedOption === quizData[currentQuestionIndex].correct) {
            score++;
        }

        currentQuestionIndex++;

        if (currentQuestionIndex < quizData.length) {
            loadQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById("quiz-container").style.display = "none";
        document.getElementById("result-container").style.display = "block";
        document.getElementById("score-text").innerText = `আপনার প্রাপ্ত নম্বর: ${score} / ${quizData.length}`;
    }

    // প্রথম প্রশ্ন লোড করুন
    loadQuestion();
</script>

</body>
</html>
